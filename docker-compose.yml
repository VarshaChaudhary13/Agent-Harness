services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-ecommerce}
      POSTGRES_USER: ${DATABASE_USER:-student_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-student_dev}
    ports:
      - "5433:5432"
    volumes:
      - ./data/ecommerce.sql:/docker-entrypoint-initdb.d/01-ecommerce.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-student_user} -d ${DATABASE_NAME:-ecommerce}"]
      interval: 30s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"   # optional, handy for debugging from the host
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${LLM_MODEL:-qwen3.5:4b}"]
    # This container does the work then exits 0.
    # api waits on it via service_completed_successfully below.

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_NAME: ${DATABASE_NAME:-ecommerce}
      DATABASE_USER: ${DATABASE_USER:-student_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-student_dev}
      DATABASE_HOST: db
      DATABASE_PORT: 5432

      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
      OLLAMA_BASE_URL: http://ollama:11434

      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-agent-harness}

      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-agent-harness}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    command:
      ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      STREAMLIT_SERVER_HEADLESS: "true"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    command:
      ["streamlit", "run", "ui/streamlit_app.py",
       "--server.address", "0.0.0.0", "--server.port", "8501"]

volumes:
  postgres_data:
  ollama_data: